--- #################### 启凌智搭相关配置 ####################

enlev:
  info:
    version: 1.0.0
    base-package: cn.enlev.ainb
  web:
    admin-ui:
      url: http://dashboard.enlev.cn # Admin 管理后台 UI 的地址
  xss:
    enable: false
    exclude-urls: # 如下两个 url，仅仅是为了演示，去掉配置也没关系
      - ${spring.boot.admin.context-path}/** # 不处理 Spring Boot Admin 的请求
      - ${management.endpoints.web.base-path}/** # 不处理 Actuator 的请求
  security:
    permit-all_urls:
      - /admin-api/mp/open/** # 微信公众号开放平台，微信回调接口，不需要登录
  api-encrypt:
    enable: false # 是否开启 API 加密。默认关闭，避免低版本 JDK 8（8u120 以下）启动时 bcprov 的 JCE 认证报错
    algorithm: AES # 加密算法，支持 AES、RSA 等
    request-key: 52549111389893486934626385991395 # 【AES 案例】请求加密的秘钥，，必须 16、24、32 位
    response-key: 96103715984234343991809655248883 # 【AES 案例】响应加密的秘钥，AES 案例，必须 16、24、32 位
#    request-key:  # 【RSA 案例】请求解密的私钥
#    response-key: MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQDh/CHyBcS/zEfVyINVA7+c9Xxl0CPdxPMK1OIjxaLy/7BLfbkoEpI8onQtjuzfpuxCraDem9bu3BMF0pMH95HytI3Vi0kGjaV+WLIalwgc2w37oA2sbsmKzQOP7SDLO5s2QJNAD7kVwd+Q5rqaLu2MO0xVv+0IUJhn83hClC0L5wIDAQAB # 【RSA 案例】响应加密的公钥
  websocket:
    enable: true # websocket的开关
    path: /infra/ws # 路径
    sender-type: local # 消息发送的类型，可选值为 local、redis、rocketmq、kafka、rabbitmq
    sender-rocketmq:
      topic: ${spring.application.name}-websocket # 消息发送的 RocketMQ Topic
      consumer-group: ${spring.application.name}-websocket-consumer # 消息发送的 RocketMQ Consumer Group
    sender-rabbitmq:
      exchange: ${spring.application.name}-websocket-exchange # 消息发送的 RabbitMQ Exchange
      queue: ${spring.application.name}-websocket-queue # 消息发送的 RabbitMQ Queue
    sender-kafka:
      topic: ${spring.application.name}-websocket # 消息发送的 Kafka Topic
      consumer-group: ${spring.application.name}-websocket-consumer # 消息发送的 Kafka Consumer Group
  swagger:
    title: 启凌智搭快速开发平台
    description: 提供管理后台、用户 App 的所有功能
    version: ${enlev.info.version}
    url: ${enlev.web.admin-ui.url}
    email: xingyu4j@vip.qq.com
    license: MIT
    license-url: https://gitee.com/enlev/ainb/blob/master/LICENSE
  codegen:
    base-package: ${enlev.info.base-package}
    db-schemas: ${spring.datasource.dynamic.datasource.master.name}
    front-type: 20 # 前端模版的类型，参见 CodegenFrontTypeEnum 枚举类
    vo-type: 10 # VO 的类型，参见 CodegenVOTypeEnum 枚举类
    delete-batch-enable: true # 是否生成批量删除接口
    unit-test-enable: false # 是否生成单元测试
    import-enable: false # 是否生成 Excel 导入接口
  data-model: # 数据建模的「建模规范」，详见 docs/数据建模规范.md
    # 下面这些管的是「别把库搞乱」（命名、前缀、注释、配额），可按需关闭；
    # 而「别把库搞坏」那一类（保留字、标识符白名单、框架表黑名单）在 SqlSafeGuard 里硬编码，任何时候都不可关。
    #
    # ⚠️ 全部只作用于【新建】路径。importTables 导入存量表一律放行 ——
    # 否则库里本就存在的 QRTZ_*（大写）、test_demo_*（无 biz_ 前缀）全都导不进来。
    table-prefix-enforced: true # 是否强制业务表前缀
    table-prefix: biz_ # 业务表前缀。与框架表黑名单是两道独立关卡，都要过
    snake-case-enforced: true # 是否强制 snake_case（禁驼峰：Linux 下 lower_case_table_names=0 时表名大小写敏感）
    index-prefix-enforced: true # 是否强制索引名前缀：UNIQUE 用 uk_、NORMAL 用 idx_
    max-column-count: 100 # 单表列数上限，0 = 不限。超过通常说明该拆表了（实测存量库最大 41 列，不会误伤）
    # 单租户模型数上限，0 = 不限。⚠️ 默认不限是刻意的：本项按总数算，存量直接决定还能不能建新表
    # （实测本地库租户 1 已有 286 个模型，给个 200 就等于让所有人都建不了表）。
    # 接入 AI 等带重试循环的调用方之前，再按实际情况显式配一个上限。
    max-table-count: 0
  permission: # 权限体系（S1~S5 重构）
    # 是否走新的授权决策引擎（sys_resource + sys_grant）。
    #
    # false 时 @ss.hasPermission 走旧路径：在 system_menu 里按权限串找菜单，
    # 「找不到对应 Menu 即判无权限」。而数据集动作（infra:form-design-run:xxx:query）
    # 只存在于 sys_resource —— 于是非超管在【所有】在线表单数据集上寸步难行，
    # 超管则因短路而毫无察觉。
    #
    # 切换前已做过对账（S5c）：旧路径放行 1549 对(角色,权限)，新引擎 1550 对，
    # 【旧有新无 = 0】，即没有任何权限点会因切换而被误杀。
    grant-enabled: true
    # 是否走「资源身份 × 动作」塌缩后的读路径（权限资源统一方案 阶段 2）。
    #
    # 🔴 这个开关与数据迁移必须同批：数据没迁就打开，判定会去查一批还不存在的身份行，
    # 结果是静默判成无权（全程 200、无异常，只是按钮全没了、接口全 403）。
    # 反过来（迁了没开）同样错，只是错得更明显。所以它在这里被显式打开，
    # 而不是留着靠 PermissionProperties 的默认 false —— 默认值一旦生效，
    # 表现就是「迁移跑完了、权限全没了」，而且没有任何日志说明原因。
    #
    # 打开前已完成的验证（阶段 2d，本地库 ruoyi-vue-pro）：
    #   · 落库 sys_resource 1022 → 598 存活行（退役 457、新建 33、menu_id 改 64、
    #     default_effect 改 7）；sys_grant 1802 → 1787（改写 1127、判重软删 15、原样 660）
    #   · 落库前用整表校验和（逐行 MD5 再聚合）比对库与快照，八项全对才允许执行
    #   · 落库在单个事务里，事务内后置守卫比对行数/悬空引用/97 个身份串后才 COMMIT
    #   · 落库后把 598 + 1787 行按列导出，与计划器+应用器算出的期望世界 diff，差为空
    #   · 自校验 CollapseMigrationSelfCheckTest 5/5 通过：hasExplicitDeny、
    #     resolveFieldModes、listAllowedMenuIds 差异均为 0；hasPermission 的 617 个差异
    #     全部落在声明白名单内（464 个收紧来自那 7 行 default_effect 翻转，
    #     153 个放开来自 57 个裸身份串 —— 全库检索确认没有任何生产代码比对裸身份串）
    #
    # ⚠️ 上一行那句话别读成「153 个放开无害」。它只说明<b>裸身份串</b>没有生产代码在比；
    #    而 FormDesignRuntimeController#checkPermission 比的是<b>带动词</b>的
    #    infra:form-design-run:{code}:{action}，塌缩后它会被翻译成同一个身份行去查 ——
    #    身份行 default_effect=ALLOW 且链上零授权时，判定回落成放行。
    #    自校验枚举不到这批串（它只从 system_menu.permission 取，而这些锚点 menu_id 为 NULL）。
    #    实测已打穿 3 张已发布表单（非超管、零授权，/config 与 /page 均返回 code=0 与真实数据行）。
    #    完整口径与处置见 GrantDecisionService#lookupOf 里那段 ⚠️ 注释（唯一权威副本）。
    collapse-enabled: true
    # 派生可见性的业务主键数告警阈值。超过只打 ERROR，不改变行为 ——
    # 截断会静默少数据、拒绝会让「参与得越多看到的越少」，两者都比慢查询糟糕
    derived-key-warn-threshold: 5000
    subject:
      # 部门是否作为授权主体。
      #
      # v10 §7.2 定的是「模型支持、默认关闭」，这里【显式打开】，原因是 S7b 摘掉了
      # 流程发起范围的存量回落：flowable 流程定义上的 startDeptIds 现在被投影成
      # DEPT 主体的 START 授权（不能在投影时展开成该部门当前的成员 ——
      # 那样之后调进这个部门的人就不会自动获得发起权，而配置界面上部门名还写着）。
      #
      # 关着的话表现是：在流程设计器里配了「研发部可发起」，保存成功、
      # 授权行也插进去了，研发部的人却一个都发不了，且没有任何提示。
      #
      # ⚠️ 打开前已确认影响面为零：库里此前【没有任何 DEPT 主体的授权行】，
      # 所以这个开关在打开的瞬间不会改变任何既有判定。
      # v10 当初担心的是「把数据范围误配成功能授权」，那是授权界面该防的事（S8）
      dept-enabled: true
  tenant: # 多租户相关配置项
    enable: true
    ignore-urls:
      - /jmreport/* # 积木报表，无法携带租户编号
    ignore-visit-urls:

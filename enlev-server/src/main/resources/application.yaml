      kd-niao:
        api-key: cb022f1e-48f1-4c4a-a723-9001ac9676b8
        business-id: 1809751
        request-type: 1002 # 免费版 1002；付费版 8001
      kd100:
        key: pLXUGAwK5305
        customer: E77DF18BE109F454A5CD319E44BF5177
  iot:
    message-bus:
      type: redis # 消息总线的类型
  agent: # AI 助手 / 流程编排模块（enlev-module-agent）
    webhook: # Webhook 匿名入站端点的配置。详见 AgentWebhookProperties 的字段注释
      # 🔴 这是 agent 模块唯一的匿名可达面（@PermitAll），每一次命中都是一次「无头拉起流程」
      #    （烧 token、写业务数据、占图执行线程）。验签只能证明请求来自持密钥者，
      #    证明不了他没在一秒内发一万个 —— 所以必须有按量计量的闸门。
      rate-limit-enabled: true # 关掉 = 本端点回到「谁都能打」，只在限流器自己成为故障源时用来止血
      # IP 维度：挡「单个来源刷量」。阈值刻意低于 path 维度，故单个来源永远撞不到 path 层。
      # 🔴 来源 IP 取自 X-Forwarded-For / X-Real-IP 等客户端可控的头（ServletUtils.getClientIP 的默认行为），
      #    没有可信反代兜住这些头时，直连客户端改一个头就能换掉自己的「IP」——
      #    真正承重的是下面那层 path 维度，这也是两层必须 AND 而不是 OR 的原因。
      rate-limit-ip-count: 60 # 单 IP 每窗口最多放行 60 个（平均 1 秒 1 个，够正当对接方的突发余量）
      rate-limit-ip-window-seconds: 60
      # path 维度：护「一个 hook 背后那条流程的 token 预算与写库次数」，按被保护的资源计数、跨所有来源合计。
      # 它不看来源，所以伪造 IP 对它无效 —— 一百台机器各发 50 个时，IP 层一个都不拦，这一层拦。
      rate-limit-path-count: 300 # 单 path 每窗口最多放行 300 个（所有来源 IP 合计）
      rate-limit-path-window-seconds: 60 # 与 IP 层同取 60，让两层窗口对齐，排障时好解释「哪层先撞墙」
      # body 整体上限（B2-4 的「第一道闸」）。量的是【整个原始 body】，与下面 sanitize.webhook-body-max-length
      # 量的【单个字符串叶子】是两个不同的量，两个都要有：一个 body 可以每个叶子都合规、
      # 却靠「叶子特别多」把总量堆到几百 MB —— 只按叶子限长的话，我们要把它整个解析、整个遍历完才知道。
      # 两道闸的动作也不同：这道【拒】（调用方拿到非零 code，知情），叶子那道【截】（调用方仍是 200，不知情）。
      # 阈值刻意比叶子档高一个数量级还多：它管的是「荒谬的量」，不是「单字段该多长」。
      # 收得跟叶子档一样紧，结局是正当对接方天天撞墙、最后现场把它调大到形同虚设，那比一开始就宽松更糟。
      # ⚠️ 这道闸【不】护内存：走到这里时 Spring 已把整个 body 读进 String 了，
      #    而 application/json 不受 Tomcat maxPostSize 约束（容器层默认没有字节上限）。
      #    它的职责是「别为注定被削减的请求付解析代价」+「让调用方知情」。详见 WORKFLOW_WEBHOOK_BODY_TOO_LARGE。
      max-body-length: 1048576 # 1 MiB
    sanitize: # 不可信输入进 state 之前的处置档位。详见 AgentSanitizeProperties 的字段注释
      # 🔴 五个污点源各有各的合理上限，差着两个数量级：检索片段是被切过块的（几千字符就异常），
      #    webhook body 是机器对机器的整张订单 JSON（几万字符正常）。给同一个数只有两种结局——
      #    取小值把合法业务数据截成半截且不报错，取大值等于对检索片段不设防。
      # 🔴 限的是「单个字符串叶子」，不是整个 body 的字节数：body 解析成 map 后逐个叶子过。
      chat-max-length: 4000 # 人在输入框里打字；每个字符都逐字进 prompt，是直接按 token 计钱的
      webhook-body-max-length: 32768 # 机器对机器，含几十个明细行的订单 JSON 是正当形状
      form-event-value-max-length: 8192 # 表单里的长文本是业务数据（会写回库），被截的代价比聊天高
      retrieval-segment-max-length: 4000 # 🔴 五档里最该收紧的：谁能往知识库传文件，谁就能往 prompt 里写字，
      #   而知识库上传权限与流程编辑权限不是同一个权限 ⟹ 攻击者门槛最低、且内容 100% 逐字进 prompt
      tool-result-max-length: 16384 # 外部系统响应，长度不由我们控制；宁可给大让它完整地被包进数据段，
      #   也不要截断后让残留的半句话落在包裹之外
      max-depth: 16 # 递归深度上限。🔴 这不是「精细度」参数，是「别把线程搞死」参数：
      #   无界递归抛的 StackOverflowError 不是 Exception，执行层那些 catch(Exception) 一个都拦不住。
      #   超限的处置是丢弃该子树 + warn，不是原样保留（原样保留 = 让没处置过的值进 state）
      # 🔴 刻意不留「总开关」：本组件是纯字符串处理、不碰外部依赖，不会自己成为故障源。
      #    关掉它能换来的只有「控制字符不再被剥、超长内容不再被截」——那不是止血，是把防线拆了。
      #    单个源挡住合法数据时，调那一个源的档位即可。

debug: false
